<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF RAG</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1>PDF RAG</h1>
    <span id="status" class="status">connecting…</span>
  </header>

  <main>
    <!-- ─────────────────────────────── left: ingestion ─────────────────────── -->
    <aside>
      <section>
        <h2>Documents <span class="count" id="docCount"></span></h2>
        <label class="upload" id="dropzone">
          <input type="file" id="file" accept="application/pdf" hidden>
          <svg class="upload-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M12 16V4m0 0-4 4m4-4 4 4M5 16v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2"
                  fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="upload-title" id="uploadLabel">Drop a PDF or <u>browse</u></span>
          <span class="upload-sub">Extracted, chunked and embedded on upload</span>
        </label>
        <p class="hint" id="uploadHint" aria-live="polite"></p>
        <ul id="documents" class="documents"></ul>
      </section>

    </aside>

    <!-- ─────────────────────────────── right: chat ──────────────────────────── -->
    <section class="chat">
      <div id="messages" class="messages">
        <div class="empty" id="empty">
          <p>Upload a PDF, then ask it a question.</p>
        </div>
      </div>

      <form id="form" class="composer">
        <input id="question" placeholder="Ask about the document…" autocomplete="off" required>
        <button id="send" type="submit">Ask</button>
      </form>
    </section>
  </main>

  <script src="/app.js" type="module"></script>
</body>
</html>
